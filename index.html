<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#050505" />

    tailwind.config = {

  <style>
    :root { --void: #050505; --cyan: #00f3ff; --magenta: #ff00ff; }
    html { scroll-behavior: smooth; }
    body { background: var(--void); color: #f4f4f5; }
    .grid-neon {
      background-image:
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .hero-glow {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 243, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 20%, rgba(255, 0, 255, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 35% at 15% 80%, rgba(184, 255, 60, 0.06), transparent 45%);
    }
    .btn-primary {
      background: linear-gradient(90deg, #00f3ff, #00c8d4);
      color: #050505;
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.45);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost {
      border: 1px solid rgba(255, 0, 255, 0.45);
      color: #ff00ff;
      box-shadow: 0 0 18px rgba(255, 0, 255, 0.15);
    }
    .panel {
      border: 1px solid rgba(0, 243, 255, 0.18);
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.03);
    }
    .panel-mag {
      border-color: rgba(255, 0, 255, 0.28);
      box-shadow: inset 0 0 40px rgba(255, 0, 255, 0.04);
    }
    .term {
      border: 1px solid rgba(0, 243, 255, 0.25);
      background: #03080a;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.08), inset 0 0 30px rgba(0, 243, 255, 0.03);
    }
    .price-glow:hover {
      border-color: rgba(0, 243, 255, 0.55);
      box-shadow: 0 0 32px rgba(0, 243, 255, 0.2);
    }
    .modal-backdrop {
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(10px);
    }
    @keyframes pulse-line {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .pulse-line { animation: pulse-line 3s ease-in-out infinite; }

    /* Background noise / film grain */
    .bg-noise {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      animation: noise-shift 0.4s steps(2) infinite;
    }
    @keyframes noise-shift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1.5%, 1%); }
      50% { transform: translate(1%, -1.5%); }
      75% { transform: translate(-1%, -0.5%); }
      100% { transform: translate(0.5%, 1%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-noise { animation: none; }
    }
    .dl-menu {
      border: 1px solid rgba(0, 243, 255, 0.28);
      background: rgba(3, 8, 10, 0.96);
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.12), inset 0 0 24px rgba(0, 243, 255, 0.03);
    }
    .dl-option:hover {
      background: rgba(0, 243, 255, 0.08);
      border-color: rgba(0, 243, 255, 0.45);

<body class="font-mono antialiased overflow-x-hidden">
  <div class="bg-noise" aria-hidden="true"></div>
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion": "https://esm.sh/framer-motion@11.15.0?deps=react@18.3.1,react-dom@18.3.1",
      "qrcode": "https://esm.sh/qrcode@1.5.4"
    }
  }
  </script>

  <script type="module">
    import React, { useState, useCallback, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { motion, AnimatePresence } from "framer-motion";
    import QRCode from "qrcode";

    const h = React.createElement;

    const AUTHOR = { name: "Roberto de Souza", email: "rabbittrix@hotmail.com" };
    const BANK = { iban: "BE72 9670 8136 8616", bic: "TRWIBEB1XXX" };
    const PIX_KEY = "2417f0d5-b9e3-4b80-9ab0-70834da5d2a9";
    // Prefer generating the QR at runtime; keep a public asset as offline fallback.
    const PIX_QR_ASSET =
      "https://raw.githubusercontent.com/rabbittrix/vulto-io/main/assets/pix_qr.png";
    // Site-hosted installers on the public repo (works even if Pages is on a private mirror).
    const PUBLIC_REPO = "rabbittrix/vulto-io";
    const RELEASE_TAG = "v1.2.1";
    const RELEASES_PAGE = `https://github.com/${PUBLIC_REPO}/releases/latest`;
    const RELEASE_API = `https://api.github.com/repos/${PUBLIC_REPO}/releases/latest`;
    // Installers live on GitHub Releases — not in the Pages tree (keeps the free site light).
    const RELEASE_DL = `https://github.com/${PUBLIC_REPO}/releases/download/${RELEASE_TAG}`;
    const SITE_DOWNLOADS = {
      windows: `${RELEASE_DL}/Vulto_1.2.1_x64-setup.exe`,
      windowsMsi: `${RELEASE_DL}/Vulto_1.2.1_x64_en-US.msi`,
      linuxAppImage: `${RELEASE_DL}/Vulto_1.2.1_amd64.AppImage`,
      linuxDeb: `${RELEASE_DL}/Vulto_1.2.1_amd64.deb`,
    };

    function pickAsset(assets, re) {
      const hit = (assets || []).find((a) => re.test(a.name));
      return hit ? hit.browser_download_url : null;
    }

    async function resolveDownloads() {
      try {
        const res = await fetch(RELEASE_API, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!res.ok) return { ...SITE_DOWNLOADS };
        const data = await res.json();
        const assets = data.assets || [];
        return {
          windows:
            pickAsset(assets, /x64-setup\.exe$/i) ||
            pickAsset(assets, /-setup\.exe$/i) ||
            SITE_DOWNLOADS.windows,
          windowsMsi: pickAsset(assets, /\.msi$/i) || SITE_DOWNLOADS.windowsMsi,
          linuxAppImage: pickAsset(assets, /\.AppImage$/i) || SITE_DOWNLOADS.linuxAppImage,
          linuxDeb: pickAsset(assets, /\.deb$/i) || SITE_DOWNLOADS.linuxDeb,
        };
      } catch {
        return { ...SITE_DOWNLOADS };
      }
    }

    function sortVersionTags(byVersion) {
      return Object.entries(byVersion || {}).sort(([a], [b]) => {
        const pa = a.replace(/^v/i, "").split(".").map(Number);
        const pb = b.replace(/^v/i, "").split(".").map(Number);
        for (let i = 0; i < Math.max(pa.length, pb.length); i += 1) {
          const diff = (pb[i] || 0) - (pa[i] || 0);
          if (diff !== 0) return diff;
        }
        return b.localeCompare(a);
      });
    }

    async function loadDownloadStats() {
      /** @type {{ total?: number, by_version?: Record<string, number>, last_download_at?: string|null, updated_at?: string|null }|null} */
      let snapshot = null;
      try {
        const res = await fetch("./stats.json", { cache: "no-store" });
        if (res.ok) snapshot = await res.json();
      } catch {
        /* offline / first deploy */
      }

      try {
        const res = await fetch(
          `https://api.github.com/repos/${PUBLIC_REPO}/releases?per_page=30`,
          { headers: { Accept: "application/vnd.github+json" } },
        );
        if (res.ok) {
          const releases = await res.json();
          /** @type {Record<string, number>} */
          const by_version = {};
          let total = 0;
          for (const rel of releases) {
            if (rel.draft || rel.prerelease) continue;
            const count = (rel.assets || []).reduce(
              (sum, asset) => sum + (asset.download_count || 0),
              0,
            );
            by_version[rel.tag_name] = count;
            total += count;
          }
          return {
            total,
            by_version,
            last_download_at: snapshot?.last_download_at ?? null,
            updated_at: snapshot?.updated_at ?? null,
          };
        }
      } catch {
        /* rate limit / offline */
      }

      if (snapshot) {
        return {
          total: snapshot.total ?? 0,
          by_version: snapshot.by_version ?? {},
          last_download_at: snapshot.last_download_at ?? null,
          updated_at: snapshot.updated_at ?? null,
        };
      }
      return null;
    }

    function formatStatsDate(iso) {
      if (!iso) return null;
      try {
        return new Intl.DateTimeFormat("en-GB", {
          year: "numeric",
          month: "short",
          day: "2-digit",
          timeZone: "UTC",
        }).format(new Date(iso));
      } catch {
        return iso.slice(0, 10);
      }
    }

    function DownloadStats() {
      const [stats, setStats] = useState(null);

      useEffect(() => {
        let active = true;
        void loadDownloadStats().then((data) => {
          if (active && data) setStats(data);
        });
        return () => {
          active = false;
        };
      }, []);

      if (!stats || !stats.total) return null;

      const parts = [`Σ ${stats.total}`];
      for (const [tag, count] of sortVersionTags(stats.by_version)) {
        if (count > 0) parts.push(`${tag}: ${count}`);
      }
      const last = formatStatsDate(stats.last_download_at);
      if (last) parts.push(`last ${last}`);

      return h(
        "p",
        {
          className:
            "text-[9px] font-mono text-white/18 tracking-[0.12em] mt-3 select-none",
          title: "GitHub Releases download telemetry (private footer)",
          "aria-label": "Download statistics",
        },
        parts.join(" · "),
      );
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }
    }

    function BrazilFlag({ className = "w-5 h-3.5" }) {
      return h(
        "svg",
        { viewBox: "0 0 22 15", className, "aria-hidden": true },
        h("rect", { width: "22", height: "15", fill: "#009c3b" }),
        h("polygon", { points: "11,1.5 20.5,7.5 11,13.5 1.5,7.5", fill: "#ffdf00" }),
        h("circle", { cx: "11", cy: "7.5", r: "3.2", fill: "#002776" })
      );
    }

    function CopyField({ label, value, copyLabel = "Copy" }) {
      const [copied, setCopied] = useState(false);
      const onCopy = async () => {
        if (!(await copyText(value))) return;
        setCopied(true);
        window.setTimeout(() => setCopied(false), 1400);
      };
      return h(
        "div",
        { className: "border border-cyan/40 bg-black/60 p-3 shadow-[0_0_16px_rgba(0,243,255,0.12)]" },
        h(
          "div",
          { className: "flex items-center justify-between gap-2 mb-1" },
          h(
            "p",
            { className: "text-[10px] font-display tracking-[0.2em] text-white/45 uppercase" },
            label
          ),
          h(
            "button",
            {
              type: "button",
              onClick: () => void onCopy(),
              className:
                "px-2 py-0.5 text-[10px] uppercase tracking-wider border border-cyan/40 text-cyan hover:bg-cyan/10",
            },
            copied ? "Copied!" : copyLabel
          )
        ),
        h("p", { className: "font-mono text-sm break-all text-cyan select-all" }, value)
      );
    }

    function TermBlock({ children }) {
      return h(
        "pre",
        {
          className:
            "term p-4 text-[11px] sm:text-xs leading-relaxed text-cyan/90 overflow-x-auto whitespace-pre",
        },
        children
      );
    }

    function SectionTitle({ kicker, title, sub }) {
      return h(
        "div",
        { className: "mb-10 max-w-2xl" },
        kicker &&
          h(
            "p",
            { className: "text-[10px] font-display tracking-[0.3em] text-magenta mb-2" },
            kicker
          ),
        h(
          "h2",
          { className: "font-display text-2xl sm:text-3xl tracking-[0.18em] text-white" },
          title
        ),
        sub && h("p", { className: "mt-3 text-sm text-white/50 leading-relaxed" }, sub)
      );
    }

    function PaymentModal({ open, onClose, tier }) {
      const [tab, setTab] = useState("intl");
      const [pixQrSrc, setPixQrSrc] = useState(PIX_QR_ASSET);
      const amount = tier === "business" ? "$34.99" : "$19.99";
      const tierName = tier === "business" ? "Business/Dev" : "Personal";
      const mailto = `mailto:${AUTHOR.email}?subject=${encodeURIComponent(
        `Vulto ${tierName} License`
      )}&body=${encodeURIComponent(
        `Hello Roberto,\n\nI paid ${amount} USD for a Vulto ${tierName} license.\n\nUser Hash:\n[PASTE FROM UNLOCK SCREEN]\n\nPlease send my activation key.\n\nThanks.`
      )}`;

      useEffect(() => {
        if (!open) return;
        let alive = true;
        QRCode.toDataURL(PIX_KEY, {
          width: 280,
          margin: 2,
          errorCorrectionLevel: "M",
          color: { dark: "#000000", light: "#ffffff" },
        })
          .then((url) => {
            if (alive) setPixQrSrc(url);
          })
          .catch(() => {
            if (alive) setPixQrSrc(PIX_QR_ASSET);
          });
        return () => {
          alive = false;
        };
      }, [open]);

      return h(
        AnimatePresence,
        null,
        open &&
          h(
            motion.div,
            {
              className: "fixed inset-0 z-50 flex items-center justify-center p-4",
              initial: { opacity: 0 },
              animate: { opacity: 1 },
              exit: { opacity: 0 },
            },
            h("div", { className: "absolute inset-0 modal-backdrop", onClick: onClose }),
            h(
              motion.div,
              {
                initial: { scale: 0.94, y: 20, opacity: 0 },
                animate: { scale: 1, y: 0, opacity: 1 },
                exit: { scale: 0.96, opacity: 0 },
                className:
                  "relative w-full max-w-2xl max-h-[92vh] overflow-y-auto border border-magenta/40 bg-[#080808] shadow-[0_0_40px_rgba(255,0,255,0.25)] p-6",
              },
              h(
                "div",
                { className: "flex items-start justify-between gap-4 mb-5" },
                h(
                  "div",
                  null,
                  h(
                    "p",
                    { className: "text-[10px] font-display tracking-[0.3em] text-cyan mb-1" },
                    "CYBER-FINANCIAL RAIL"
                  ),
                  h(
                    "h2",
                    { className: "font-display text-2xl tracking-widest text-magenta" },
                    "UNLOCK VULTO"
                  ),
                  h(
                    "p",
                    { className: "text-white/55 text-sm mt-1" },
                    `${tierName} · `,
                    h("span", { className: "text-lime" }, amount),
                    " · hardware-bound"
                  )
                ),
                h(
                  "button",
                  {
                    type: "button",
                    onClick: onClose,
                    className: "text-white/40 hover:text-white text-xl leading-none px-2",
                    "aria-label": "Close",
                  },
                  "×"
                )
              ),
              h(
                "div",
                { className: "flex gap-2 border-b border-white/10 mb-4" },
                h(
                  "button",
                  {
                    type: "button",
                    onClick: () => setTab("intl"),
                    className: `px-3 py-2 text-[10px] font-display tracking-widest uppercase ${
                      tab === "intl" ? "text-lime border-b-2 border-lime" : "text-white/40"
                    }`,
                  },
                  "International"
                ),
                h(
                  "button",
                  {
                    type: "button",
                    onClick: () => setTab("brasil"),
                    className: `px-3 py-2 text-[10px] font-display tracking-widest uppercase flex items-center gap-2 ${
                      tab === "brasil" ? "text-lime border-b-2 border-lime" : "text-white/40"
                    }`,
                  },
                  h(BrazilFlag),
                  "Brasil · PIX"
                )
              ),
              tab === "intl"
                ? h(
                    "div",
                    { className: "space-y-3" },
                    h(CopyField, { label: "IBAN", value: BANK.iban }),
                    h(CopyField, { label: "Swift / BIC", value: BANK.bic }),
                    h(
                      "div",
                      {
                        className:
                          "border border-lime/30 bg-lime/5 px-3 py-2 flex justify-between text-sm",
                      },
                      h(
                        "span",
                        { className: "text-white/45 text-[10px] tracking-widest uppercase" },
                        "Amount"
                      ),
                      h("span", { className: "text-lime" }, `${amount} USD`)
                    )
                  )
                : h(
                    "div",
                    { className: "flex flex-col sm:flex-row gap-4" },
                    h("img", {
                      src: pixQrSrc,
                      alt: "PIX QR Code",
                      className:
                        "w-36 h-36 object-contain bg-white p-1 border border-cyan/30 shadow-[0_0_20px_rgba(0,243,255,0.2)] shrink-0",
                      onError: (e) => {
                        if (e.currentTarget.src !== PIX_QR_ASSET) {
                          e.currentTarget.src = PIX_QR_ASSET;
                        }
                      },
                    }),
                    h(
                      "div",
                      { className: "flex-1 space-y-3 min-w-0" },
                      h(CopyField, {
                        label: "Chave PIX",
                        value: PIX_KEY,
                        copyLabel: "Copiar Chave PIX",
                      }),
                      h(
                        "div",
                        {
                          className:
                            "border border-lime/30 bg-lime/5 px-3 py-2 flex justify-between text-sm",
                        },
                        h(
                          "span",
                          { className: "text-white/45 text-[10px] tracking-widest uppercase" },
                          "Valor"
                        ),
                        h("span", { className: "text-lime" }, `${amount} USD`)
                      )
                    )
                  ),
              h(
                "div",
                {
                  className:
                    "mt-5 pt-4 border-t border-white/10 space-y-2 text-[12px] text-white/70 leading-relaxed",
                },
                h(
                  "p",
                  null,
                  h("span", { className: "text-cyan" }, "01 · "),
                  `Transmit ${amount} on the rail above.`
                ),
                h(
                  "p",
                  null,
                  h("span", { className: "text-cyan" }, "02 · "),
                  "Open Vulto → Unlock · copy your ",
                  h("strong", { className: "text-white" }, "User Hash"),
                  " (KRLY-salted fingerprint)."
                ),
                h(
                  "p",
                  null,
                  h("span", { className: "text-cyan" }, "03 · "),
                  "Email the hash to ",
                  h(
                    "a",
                    { href: mailto, className: "text-magenta underline hover:text-lime" },
                    AUTHOR.email
                  ),
                  " — receive your activation key."
                )
              )
            )
          )
      );
    }

    function DownloadChooser({ downloads }) {
      const [open, setOpen] = useState(null); // "windows" | "linux" | null
      const rootRef = React.useRef(null);

      useEffect(() => {
        function onDoc(e) {
          if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(null);
        }
        function onKey(e) {
          if (e.key === "Escape") setOpen(null);
        }
        document.addEventListener("mousedown", onDoc);
        document.addEventListener("keydown", onKey);
        return () => {
          document.removeEventListener("mousedown", onDoc);
          document.removeEventListener("keydown", onKey);
        };
      }, []);

      const menus = {
        windows: [
          {
            href: downloads.windows,
            title: "NSIS Installer",
            ext: ".exe",
            note: "Recommended · current-user setup",
          },
          {
            href: downloads.windowsMsi,
            title: "MSI Package",
            ext: ".msi",
            note: "Enterprise / silent deploy",
          },
        ],
        linux: [
          {
            href: downloads.linuxAppImage,
            title: "AppImage",
            ext: ".AppImage",
            note: "Portable · no install",
          },
          {
            href: downloads.linuxDeb,
            title: "Debian / Ubuntu",
            ext: ".deb",
            note: "apt-friendly package",
          },
        ],
      };

      function toggle(platform) {
        setOpen((cur) => (cur === platform ? null : platform));
      }

      function Option({ href, title, ext, note }) {
        return h(
          "a",
          {
            href,
            className:
              "dl-option flex items-start justify-between gap-4 px-4 py-3 border border-transparent transition-colors",
            onClick: () => setOpen(null),
          },
          h(
            "span",
            null,
            h("span", { className: "block text-sm text-white" }, title),
            h("span", { className: "block text-[11px] text-white/40 mt-0.5" }, note)
          ),
          h(
            "span",
            { className: "shrink-0 font-display text-[10px] tracking-widest text-cyan uppercase mt-0.5" },
            ext
          )
        );
      }

      return h(
        "div",
        { ref: rootRef, className: "mt-10 space-y-3", id: "download" },
        h(
          "div",
          { className: "flex flex-wrap gap-3" },
          h(
            motion.button,
            {
              type: "button",
              whileHover: { scale: 1.03 },
              whileTap: { scale: 0.98 },
              onClick: () => toggle("windows"),
              "aria-expanded": open === "windows",
              className:
                "btn-primary inline-flex items-center gap-2 px-7 py-3.5 font-display text-sm tracking-[0.2em] uppercase",
            },
            "Download for Windows",
